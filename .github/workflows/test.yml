# Runs the tests on every push and pull request, on the three systems the
# library is meant for and on both 64-bit processor families.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The race detector makes the tests several times slower: on a small
      # machine the main package alone takes more than the ten minutes a
      # test run is given by default.
      - run: go test -race -timeout 45m . ./tests ./pipeline ./cmd/...

  bits32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOARCH=386 go test ./...

  platforms:
    # Everything else is at least built and vetted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for t in linux/arm linux/riscv64 linux/ppc64le linux/s390x linux/loong64 freebsd/amd64 openbsd/amd64 netbsd/amd64 windows/arm64 js/wasm wasip1/wasm android/arm64; do
            echo "$t"
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done

  fuzz:
    # A short run of each fuzz target, as a smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 60s ./tests
      - run: go test -run '^$' -fuzz '^FuzzChain$' -fuzztime 60s ./tests
      - run: go test -run '^$' -fuzz '^FuzzText$' -fuzztime 30s ./tests

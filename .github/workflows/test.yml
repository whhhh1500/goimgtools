# Runs the tests on every push and pull request, on the three systems the
# library is meant for and on both 64-bit processor families.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The race detector makes the tests several times slower: on a small
      # machine the main package alone takes more than the ten minutes a
      # test run is given by default.
      - run: go test -race -timeout 45m . ./tests ./pipeline ./inspect ./cmd/...

  bits32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOARCH=386 go test ./...

  emulated:
    # Processors unlike the ones above, run under emulation: among them
    # 32-bit ARM and MIPS, and s390x and MIPS, which store numbers the other
    # way round (big-endian). Emulation is slow, so this runs the tests of
    # what the library does and of its core, not those of every decoder.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            qemu: qemu-arm
          - arch: s390x
            qemu: qemu-s390x
          - arch: riscv64
            qemu: qemu-riscv64
          - arch: ppc64le
            qemu: qemu-ppc64le
          - arch: loong64
            qemu: qemu-loongarch64
          - arch: mips
            qemu: qemu-mips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: GOARCH=${{ matrix.arch }} go test -exec ${{ matrix.qemu }} -timeout 120m ./tests ./pipeline ./inspect ./internal/resize ./internal/ops

  wasi:
    # WebAssembly, run by wasmtime: a 32-bit machine without threads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: |
          export PATH="$(go env GOROOT)/lib/wasm:$PATH"
          # What the tests look for in the environment, handed on to the
          # program inside wasmtime.
          export GOWASIRUNTIMEARGS="--env GOROOT=$(go env GOROOT) --env GOMODCACHE=$(go env GOMODCACHE) --env TMPDIR=$RUNNER_TEMP"
          go mod download
          GOOS=wasip1 GOARCH=wasm go test -timeout 60m ./pipeline ./inspect ./internal/resize ./internal/ops ./tests

  vm:
    # Other operating systems: the tests are built here and run inside a
    # virtual machine of each, which needs no Go of its own for that.
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd, netbsd, solaris]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the tests for ${{ matrix.os }}
        run: |
          mkdir -p ci/bin ci/goroot/src/image ci/mod/golang.org/x
          for p in tests pipeline inspect internal/resize internal/ops cmd/goimgtools; do
            GOOS=${{ matrix.os }} GOARCH=amd64 go test -c -o "ci/bin/$(echo $p | tr / _).test" "./$p"
          done
          # The test images the tests read: those of Go and of x/image.
          cp -r "$(go env GOROOT)/src/image/testdata" ci/goroot/src/image/
          cp -r "$(go list -m -f '{{.Dir}}' golang.org/x/image)" "ci/mod/golang.org/x/image@$(go list -m -f '{{.Version}}' golang.org/x/image)"
          chmod -R u+w ci
          cat > ci/run.sh <<'EOF'
          set -e
          root="$PWD"
          export GOROOT="$root/ci/goroot" GOMODCACHE="$root/ci/mod"
          uname -a
          for p in tests pipeline inspect internal/resize internal/ops cmd/goimgtools; do
            cd "$root/$p"
            "$root/ci/bin/$(echo $p | tr / _).test" -test.timeout 40m
          done
          EOF
      - if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh
      - if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh
      - if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh
      - if: matrix.os == 'solaris'
        uses: vmactions/solaris-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh

  platforms:
    # Everything else is at least built and vetted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          for t in freebsd/arm64 windows/arm64 js/wasm android/arm64 aix/ppc64 plan9/amd64 dragonfly/amd64 illumos/amd64; do
            echo "$t"
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done

  fuzz:
    # A short run of each fuzz target, as a smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 60s ./tests
      - run: go test -run '^$' -fuzz '^FuzzChain$' -fuzztime 60s ./tests
      - run: go test -run '^$' -fuzz '^FuzzText$' -fuzztime 30s ./tests
      - run: go test -run '^$' -fuzz '^FuzzExif$' -fuzztime 30s ./tests

# Runs the tests on every push and pull request, on the three systems the
# library is meant for and on both 64-bit processor families.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test ./...
      # The Go code that the assembly (AVX2) stands in for, on amd64.
      - if: matrix.os == 'ubuntu-latest'
        run: go test -tags purego ./internal/jpegstream/... ./internal/webpstream/... ./internal/resize/... ./internal/vp8enc/... ./internal/pngstream/... ./internal/gflate/... ./internal/ops/... ./tests

  avif:
    # The AVIF module (a module of its own, avif/): libavif translated to Go.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: avif
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test ./...

  jxl:
    # The JPEG XL module (jxl/): libjxl translated to Go.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jxl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test ./...

  heic:
    # which must give the same pixels.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        tags: ["", noasm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: heic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go vet -tags "${{ matrix.tags }}" ./...
      - run: go test -tags "${{ matrix.tags }}" ./...

  oldest-go:
    # The oldest Go the module supports, the go line of go.mod. Its
    # compress/flate is the one before Go 1.27 rewrote it, so PNG files
    # (not their pixels) differ; the checksum test knows both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      # The race detector makes the tests several times slower: on a small
      # machine the main package alone takes more than the ten minutes a
      # test run is given by default.
      - run: go test -race -timeout 45m . ./tests ./pipeline ./inspect ./cmd/...

  api:
    # No exported name of the last release may change incompatibly: its tag
    # (or commit) is in .github/api-base, the last tag without the file.
    # apidiff (golang.org/x/exp) compares the exported API of the whole
    # module with it, and that of the HEIC and AVIF modules with their tags
    # of the same release (heic/v..., avif/v...).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261113113407-e3970619a1a4
      - name: Compare with the settled API
        run: |
          tag=$(git describe --tags --abbrev=0)
          if [ -f .github/api-base ]; then tag=$(tr -d ' \r\n' < .github/api-base); fi
          echo "settled API: $tag"
          git worktree add -q "$RUNNER_TEMP/old" "$tag"
          (cd "$RUNNER_TEMP/old" && apidiff -m -w "$RUNNER_TEMP/old.api" github.com/whhhh1500/goimgtools)
          apidiff -m -w "$RUNNER_TEMP/new.api" github.com/whhhh1500/goimgtools
          apidiff -m "$RUNNER_TEMP/old.api" "$RUNNER_TEMP/new.api" | grep -v '^Ignoring internal' || true
          bad=$(apidiff -m -incompatible "$RUNNER_TEMP/old.api" "$RUNNER_TEMP/new.api" | grep -v '^Ignoring internal' || true)
          fail=0
          if [ -n "$bad" ]; then
            echo "::error::incompatible API changes since $tag"
            fail=1
          fi
          for m in heic avif jxl; do
            if ! git rev-parse -q --verify "refs/tags/$m/$tag" > /dev/null; then
              echo "$m: no tag $m/$tag"
              continue
            fi
            git worktree add -q "$RUNNER_TEMP/old-$m" "$m/$tag"
            (cd "$RUNNER_TEMP/old-$m/$m" && apidiff -m -w "$RUNNER_TEMP/old-$m.api" "github.com/whhhh1500/goimgtools/$m")
            (cd "$m" && apidiff -m -w "$RUNNER_TEMP/new-$m.api" "github.com/whhhh1500/goimgtools/$m")
            echo "$m since $m/$tag:"
            apidiff -m "$RUNNER_TEMP/old-$m.api" "$RUNNER_TEMP/new-$m.api" | grep -v '^Ignoring internal' || true
            bad=$(apidiff -m -incompatible "$RUNNER_TEMP/old-$m.api" "$RUNNER_TEMP/new-$m.api" | grep -v '^Ignoring internal' || true)
            if [ -n "$bad" ]; then
              echo "::error::incompatible API changes in $m since $m/$tag"
              fail=1
            fi
          done
          exit $fail

  bits32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: GOARCH=386 go test ./...

  fused:
    # Processors with fused multiply-add (ARM64, POWER, s390x, RISC-V,
    # LoongArch) may round a*b+c once instead of twice, and the same image
    # would come out differently on them: no floating-point product may be
    # fused with an addition (an explicit conversion, float64(a*b) + c,
    # rounds the product first). This lists any the compiler still fuses,
    # in the library, in the HEIC module's colour conversion, and in the
    # codecs of the HEIC, AVIF and JPEG XL modules (Kvazaar, libavif and
    # libjxl translated from WebAssembly, whose translation converts every
    # product).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: No fused multiply-add
        run: |
          bad=0
          s=$RUNNER_TEMP/asm.txt
          for arch in arm64 ppc64le s390x riscv64 loong64; do
            for p in .:./... heic:. heic:./internal/kvazaar avif:./internal/libavif jxl:./internal/libjxl; do
              # The listing of a translated codec runs to millions of lines:
              # it goes to a file, not into a variable.
              (cd "${p%%:*}" && GOARCH=$arch go build -a -gcflags=-S "${p#*:}") > "$s" 2>&1 || { tail -20 "$s"; exit 1; }
              found=$(grep -E '\sFN?M(ADD|SUB)[SDF]?\s' "$s" | grep -oE 'goimgtools/[^ :]+\.go:[0-9]+' | sort -u)
              if [ -n "$found" ]; then
                echo "::error::$arch fuses a multiplication and an addition at:"
                echo "$found"
                bad=1
              fi
            done
          done
          exit $bad

  emulated:
    # Processors unlike the ones above, run under emulation: among them
    # 32-bit ARM and MIPS, and s390x and MIPS, which store numbers the other
    # way round (big-endian). Emulation is slow, so this runs the tests of
    # what the library does and of its core, not those of every decoder.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            qemu: qemu-arm
          - arch: s390x
            qemu: qemu-s390x
          # Its emulator's floating point is the slowest by far: with the
          # invisible watermark's tests the job went from 24 minutes to 71,
          # most of it reading marks after the attacks. The marks it makes
          # are still checked (TestInvisibleWatermarkSame and the golden
          # hashes).
          - arch: riscv64
            qemu: qemu-riscv64
            skip: "^TestInvisibleWatermark$"
          - arch: ppc64le
            qemu: qemu-ppc64le
          - arch: loong64
            qemu: qemu-loongarch64
          - arch: mips
            qemu: qemu-mips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      # Each test's time is printed: emulation slows some far more than
      # others (floating point most).
      - run: |
          set -o pipefail
          GOARCH=${{ matrix.arch }} go test -exec ${{ matrix.qemu }} -timeout 120m -skip "${{ matrix.skip || '^$' }}" -v ./tests ./pipeline ./inspect ./internal/resize ./internal/ops | grep -E '^(--- (PASS|FAIL|SKIP)|FAIL|ok|panic)|^ +[^ ]+\.go:[0-9]+:'
      # The HEIC encoder (Kvazaar translated to Go) gives the same stream,
      # HEIC files decoded a row of tiles at a time the same pixels, and
      # libavif (AVIF) and libjxl (JPEG XL) the same file.
      - working-directory: heic
        run: |
          GOARCH=${{ matrix.arch }} go test -exec ${{ matrix.qemu }} -timeout 30m -v ./internal/kvazaar
          GOARCH=${{ matrix.arch }} go test -exec ${{ matrix.qemu }} -timeout 30m -v -run 'TestStreamSameAsWhole|TestStreamTurned|TestStreamDeep' .
      - working-directory: avif
        run: GOARCH=${{ matrix.arch }} go test -exec ${{ matrix.qemu }} -timeout 30m -v ./internal/libavif
      - working-directory: jxl
        run: GOARCH=${{ matrix.arch }} go test -exec ${{ matrix.qemu }} -timeout 30m -v ./internal/libjxl

  wasi:
    # WebAssembly, run by wasmtime: a 32-bit machine without threads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: |
          export PATH="$(go env GOROOT)/lib/wasm:$PATH"
          # What the tests look for in the environment, handed on to the
          # program inside wasmtime.
          export GOWASIRUNTIMEARGS="--env GOROOT=$(go env GOROOT) --env GOMODCACHE=$(go env GOMODCACHE) --env TMPDIR=$RUNNER_TEMP"
          go mod download
          GOOS=wasip1 GOARCH=wasm go test -timeout 60m ./pipeline ./inspect ./internal/resize ./internal/ops ./tests

  js:
    # WebAssembly for browsers and node (GOOS=js), run by node: the oldest
    # and newest versions still in use. A run that gets out of hand is
    # stopped by the time limit, not left to fill the machine.
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: |
          export PATH="$(go env GOROOT)/lib/wasm:$PATH"
          go mod download
          # Each test program runs in a node of its own; the peak memory of
          # each is printed after it, to see that node stays bounded.
          for p in pipeline inspect internal/resize internal/ops tests; do
            status=0
            GOOS=js GOARCH=wasm /usr/bin/time -v -o time.txt go test -timeout 60m "./$p" || status=$?
            grep -E "Maximum resident" time.txt | sed "s#^#  $p: #"
            [ $status -eq 0 ] || exit $status
          done

  vm:
    # Other operating systems: the tests are built here and run inside a
    # virtual machine of each, which needs no Go of its own for that.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: freebsd, goos: freebsd}
          - {os: openbsd, goos: openbsd}
          - {os: netbsd, goos: netbsd}
          - {os: solaris, goos: solaris}
          - {os: dragonfly, goos: dragonfly}
          - {os: omnios, goos: illumos}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build the tests for ${{ matrix.os }}
        run: |
          mkdir -p ci/bin ci/goroot/src/image ci/mod/golang.org/x
          for p in tests pipeline inspect internal/resize internal/ops cli; do
            GOOS=${{ matrix.goos }} GOARCH=amd64 go test -c -o "ci/bin/$(echo $p | tr / _).test" "./$p"
          done
          # The test images the tests read: those of Go and of x/image.
          cp -r "$(go env GOROOT)/src/image/testdata" ci/goroot/src/image/
          cp -r "$(go list -m -f '{{.Dir}}' golang.org/x/image)" "ci/mod/golang.org/x/image@$(go list -m -f '{{.Version}}' golang.org/x/image)"
          chmod -R u+w ci
          cat > ci/run.sh <<'EOF'
          set -e
          root="$PWD"
          export GOROOT="$root/ci/goroot" GOMODCACHE="$root/ci/mod"
          uname -a
          for p in tests pipeline inspect internal/resize internal/ops cli; do
            cd "$root/$p"
            "$root/ci/bin/$(echo $p | tr / _).test" -test.timeout 40m
          done
          EOF
      - if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh
      - if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh
      - if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh
      - if: matrix.os == 'solaris'
        uses: vmactions/solaris-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh
      - if: matrix.os == 'dragonfly'
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh
      - if: matrix.os == 'omnios'
        uses: vmactions/omnios-vm@v1
        with:
          usesh: true
          run: sh ci/run.sh

  android:
    # Android, on the emulator: the tests are built with the Android NDK
    # that comes with the machine, pushed onto the emulator and run there.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build the tests for Android
        run: |
          mkdir -p ci/bin ci/goroot/src/image ci/mod/golang.org/x
          cc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          for p in tests pipeline inspect internal/resize internal/ops cli; do
            GOOS=android GOARCH=amd64 CGO_ENABLED=1 CC="$cc" go test -c -o "ci/bin/$(echo $p | tr / _).test" "./$p"
          done
          cp -r "$(go env GOROOT)/src/image/testdata" ci/goroot/src/image/
          cp -r "$(go list -m -f '{{.Dir}}' golang.org/x/image)" "ci/mod/golang.org/x/image@$(go list -m -f '{{.Version}}' golang.org/x/image)"
          chmod -R u+w ci
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: sh ci/android.sh

  ios:
    # iOS, on the simulator, with the runner Go ships for it
    # (misc/ios/go_ios_exec.go), which puts each test program with the test
    # data of its package into an app. That runner wants the source under
    # GOPATH, hence where the repository is checked out.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOPATH: ${{ github.workspace }}/gopath
    steps:
      - uses: actions/checkout@v4
        with:
          path: gopath/src/github.com/whhhh1500/goimgtools
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      - name: Start a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; d = json.load(sys.stdin)["devices"]; print(next(x["udid"] for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
      - name: Test on the simulator
        working-directory: gopath/src/github.com/whhhh1500/goimgtools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/go_ios_arm64_exec" "$(go env GOROOT)/misc/ios/go_ios_exec.go"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # What the tests look for, handed on to the program in the simulator.
          export SIMCTL_CHILD_GOROOT="$(go env GOROOT)" SIMCTL_CHILD_GOMODCACHE="$(go env GOMODCACHE)"
          go mod download
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 CC="$(go env GOROOT)/misc/ios/clangwrap.sh"             go test -timeout 60m ./pipeline ./inspect ./internal/resize ./internal/ops ./tests

  platforms:
    # Everything else is at least built and vetted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: |
          for t in freebsd/arm64 windows/arm64 android/arm64 aix/ppc64 plan9/amd64; do
            echo "$t"
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done

  fuzz:
    # A short run of each fuzz target, as a smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - run: go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 60s ./tests
      - run: go test -run '^$' -fuzz '^FuzzChain$' -fuzztime 60s ./tests
      - run: go test -run '^$' -fuzz '^FuzzText$' -fuzztime 30s ./tests
      - run: go test -run '^$' -fuzz '^FuzzExif$' -fuzztime 30s ./tests
      - run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s ./internal/iccprof
      - run: go test -run '^$' -fuzz '^FuzzRoundTrip$' -fuzztime 30s ./internal/deflate
      - run: go test -run '^$' -fuzz '^FuzzWriterRoundTrip$' -fuzztime 30s ./internal/tiffstream/lzw
      - run: go test -run '^$' -fuzz '^FuzzSameAsXImage$' -fuzztime 30s ./internal/tiffstream/lzw

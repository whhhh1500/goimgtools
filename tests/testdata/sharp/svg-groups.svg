<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 100 100">
  <style>.a { fill: tomato; } #b { stroke: black; stroke-width: 2px } g.t rect { fill: steelblue }</style>
  <defs>
    <symbol id="s" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4"/></symbol>
    <clipPath id="c"><circle cx="50" cy="50" r="30"/></clipPath>
  </defs>
  <g opacity="0.6"><rect class="a" x="5" y="5" width="40" height="40"/><rect id="b" x="25" y="25" width="40" height="40" fill="gold"/></g>
  <g class="t" transform="rotate(20 75 25)"><rect x="60" y="10" width="30" height="30"/></g>
  <use xlink:href="#s" x="5" y="60" width="30" height="30" fill="purple"/>
  <g clip-path="url(#c)"><rect x="40" y="40" width="60" height="60" fill="green"/></g>
</svg>
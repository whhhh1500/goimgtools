<svg width="320" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="noise" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="4" result="n"/>
      <feComposite in="n" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="morph" filterUnits="userSpaceOnUse" x="100" y="0" width="100" height="100">
      <feMorphology operator="dilate" radius="3" result="d"/>
      <feMorphology in="SourceGraphic" operator="erode" radius="2"/>
      <feComposite in2="d" operator="xor"/>
    </filter>
    <filter id="conv" x="0" y="0" width="1" height="1">
      <feConvolveMatrix order="3" kernelMatrix="-2 -1 0 -1 1 1 0 1 2" preserveAlpha="true"/>
    </filter>
    <filter id="tile" x="0" y="0" width="1" height="1">
      <feOffset in="SourceGraphic" x="210" y="0" width="20" height="20" result="t"/>
      <feTile in="t"/>
    </filter>
    <filter id="diffuse" x="0" y="0" width="1" height="1">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="4" result="l"><feDistantLight azimuth="235" elevation="40"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="spot" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularExponent="12" lighting-color="#ffd080">
        <feSpotLight x="120" y="100" z="90" pointsAtX="150" pointsAtY="150" limitingConeAngle="35" specularExponent="3"/>
      </feSpecularLighting>
    </filter>
    <circle id="dot" cx="10" cy="10" r="6" fill="purple"/>
    <filter id="img" x="0" y="0" width="1" height="1">
      <feImage xlink:href="#dot" result="i"/>
      <feTile in="i" x="0" y="0" width="20" height="20" result="one"/>
      <feTile in="one"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="12" fill="black" filter="url(#noise)"/>
  <g filter="url(#morph)"><rect x="115" y="20" width="70" height="20" fill="navy"/><circle cx="150" cy="70" r="18" fill="navy"/></g>
  <circle cx="260" cy="50" r="40" fill="orange" stroke="brown" stroke-width="6" filter="url(#conv)"/>
  <g filter="url(#tile)"><rect x="210" y="0" width="0.1" height="0.1" fill="none"/><rect x="210" y="105" width="105" height="90" fill="lightyellow"/><circle cx="220" cy="10" r="7" fill="teal"/></g>
  <rect x="10" y="110" width="80" height="80" rx="15" fill="tomato" filter="url(#diffuse)"/>
  <rect x="110" y="110" width="80" height="80" fill="gray" filter="url(#spot)"/>
</svg>